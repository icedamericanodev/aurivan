name: Phone update (EAS Update)

# Publishes the app's latest code as an over-the-air update to the "preview"
# channel after each merge to main, so test APKs built on expo.dev (EAS Build,
# profile "preview") pick up small changes by themselves: the app downloads the
# update in the background and uses it the next time it opens.
#
# Safety: app.json uses the "fingerprint" runtime policy, so an update only
# reaches APKs whose native parts match it. A change to native code (a new
# library with Android code, the icon, permissions) needs a new APK instead.
# Mobile 1.23 (the rename to KaiSip: new name, icon and package id) is such a
# change: its runtime differs from the Aurivan APKs' (5e26d4b...), so those
# never receive KaiSip updates, and KaiSip 1.23 itself needs a new APK build.
#
# Needs the EXPO_TOKEN repository secret (an access token from expo.dev). If it
# is not set, the job says so and stops without failing.

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'data/domain*.json']
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true # a newer merge supersedes an older update

# Read-only token: `npm ci` runs third-party install scripts.
permissions:
  contents: read

jobs:
  update:
    name: Publish update to preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for the Expo token
        id: token
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "The EXPO_TOKEN secret is not set, so no update is published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install (also builds the content pack)
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        run: npm ci

      # Accounts are built OFF (docs/mobile/ARCHITECTURE.md "Cloud (built OFF)").
      # An update reaches every preview APK, so a cloud variable in the EAS
      # environment would switch accounts on remotely. Refuse to publish if
      # any EXPO_PUBLIC_AURIVAN_* variable is set there (project or account
      # wide) or in this job. A variable that IS listed always blocks the
      # update. If a list can't be read (token scope, CLI hiccup), it warns and
      # carries on: phones must keep getting updates, and with no cloud adapter
      # in the app yet (Phase 9) a stray flag can't reach a server, and the
      # memory backend never runs on a phone (src/cloud/runtime.on.ts).
      - name: Refuse to publish with a cloud variable set
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        run: |
          set -uo pipefail
          for scope in project account; do
            if ! raw="$(npx --yes eas-cli@24 env:list --environment preview --format short --scope "$scope" 2>&1)"; then
              echo "::warning::Couldn't read the EAS '$scope' variables, so this check was skipped for them: $raw"
              continue
            fi
            vars="$(printf '%s\n' "$raw" | sed 's/\x1b\[[0-9;]*m//g')"
            if printf '%s\n' "$vars" | grep -E '(^|[^A-Z0-9_])EXPO_PUBLIC_AURIVAN_[A-Z0-9_]*='; then
              echo "The EAS 'preview' environment ($scope) sets the variable above. Remove it: accounts are built OFF and only turn on in a new build." >&2
              exit 1
            fi
          done
          if env | grep -E '^EXPO_PUBLIC_AURIVAN_[A-Z0-9_]*='; then
            echo "This job sets the variable above. Remove it." >&2
            exit 1
          fi
          echo "No cloud variable is set for the preview update."

      - name: Publish the update
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="$(printf '%s' "${COMMIT_MESSAGE:-Manual update}" | head -n 1)"
          npx --yes eas-cli@24 update \
            --channel preview \
            --environment preview \
            --platform android \
            --message "$message" \
            --non-interactive
