name: Phone update (EAS Update)

# Publishes the app's latest code as an over-the-air update to the "preview"
# channel after each merge to main, so test APKs built on expo.dev (EAS Build,
# profile "preview") pick up small changes by themselves: the app downloads the
# update in the background and uses it the next time it opens.
#
# Safety: app.json uses the "fingerprint" runtime policy, so an update only
# reaches APKs whose native parts match it. A change to native code (a new
# library with Android code, the icon, permissions) needs a new APK instead.
# Mobile 1.23 (the rename to KaiSip: new name, icon and package id) is such a
# change: its runtime differs from the Aurivan APKs' (5e26d4b...), so those
# never receive KaiSip updates, and KaiSip 1.23 itself needs a new APK build.
# Mobile 1.24 changes the runtime again (Android code shrinking turned on, and
# the update channel moved from app.json to eas.json), so 1.24 needs new
# builds too; 1.23 phones keep working but stop getting updates.
#
# Needs the EXPO_TOKEN secret (an access token from expo.dev). If it is not
# set, the job says so and stops without failing.
#
# Automatic since 18 Oct 2026 (owner decision): each merge that changes the
# app publishes by itself, with no approval click. What keeps it safe instead:
# - The update key (EXPO_TOKEN) lives in the GitHub Environment "ota", which
#   only the main branch can use.
# - This job re-runs every check in mobile.yml (typecheck, release channels,
#   shared-rules sync, lint, tests with the cloud flag off and on, the OFF
#   bundle guard and size budgets) and publishes only if all pass. Mobile CI
#   is not a required check on main, so this is the gate that counts.
# - Only the Expo steps receive the key, and eas-cli is pinned to one exact
#   version (a new, possibly hijacked release is never fetched with the key).
# - No third-party install scripts run in this job (security audit M1, 21 Oct
#   2026): `npm ci --ignore-scripts`, then our own content build by name, and
#   npx fetches eas-cli with npm_config_ignore_scripts. None of the skipped
#   scripts is needed (proved on a clean copy: same fingerprint, byte-identical
#   JS bundle, every check below passes). The dependency CODE still runs, so
#   the real fix is signed updates: docs/mobile/SECURITY_GATES.md, gate 1.
# - It publishes to "preview" (test phones) only, never "production".
# Owner setup (docs/WEBSITE_DEPLOY.md, "GitHub settings"): Settings →
# Environments → "ota": no Required reviewers; Deployment branches: main only;
# EXPO_TOKEN as an environment secret. (15 Oct 2026 to 18 Oct 2026 a person
# approved each publish; turning that back on needs no change here.)
#
# Platforms: Android only today. Once an iOS build exists (EAS Build, any
# profile), set the repository VARIABLE EAS_UPDATE_PLATFORM to "all"
# (Settings → Secrets and variables → Actions → Variables) and updates go to
# both. A manual run can pick the platform too. The first time iOS is on,
# compare the runtime this job prints with the one on the iOS build's page on
# expo.dev: they must match, or iPhones will not take the update.
#
# Only the "preview" channel is published here, never "production": store
# builds get updates only when someone sends one on purpose.

on:
  push:
    branches: [main]
    # Every data file the app's content pack is built from (content packs, Phase A): a change
    # to the notes, principles, exam guide or lessons reaches test phones like a question fix does.
    paths: ['mobile/**', 'data/domain*.json', 'data/cisa_notes.json', 'data/mindset/**', 'data/exam/**', 'data/lessons/**', '.github/workflows/eas-update.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones get the update
        type: choice
        options: [android, ios, all]
        default: android

concurrency:
  group: eas-update
  cancel-in-progress: true # a newer merge supersedes an older update

# Read-only token: third-party code runs here (tests, the bundler, eas-cli).
permissions:
  contents: read

jobs:
  update:
    name: Publish update to preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the update key; main-only (see the top of this file).
    environment: ota
    env:
      # A manual run's choice, else the repository variable, else Android.
      PLATFORM: ${{ inputs.platform || vars.EAS_UPDATE_PLATFORM || 'android' }}
    steps:
      - name: Check for the Expo token and the platform
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          case "$PLATFORM" in
            android|ios|all) echo "Publishing for: $PLATFORM" ;;
            *) echo "EAS_UPDATE_PLATFORM must be android, ios or all (it is \"$PLATFORM\")." >&2; exit 1 ;;
          esac
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "The EXPO_TOKEN secret is not set, so no update is published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # --ignore-scripts: no package's install script runs in the job that holds
      # the update key. The ones skipped: our own postinstall (the content pack,
      # run by name on the next line), @parcel/watcher and unrs-resolver (both
      # only fall back to building or fetching a native binary that npm already
      # installed from the lockfile).
      - name: Install without install scripts, then build the content pack
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          node scripts/build-content.mjs

      # The safety check that replaced the approval click: every check in
      # mobile.yml. Any failure stops the publish.
      - name: Check the app before publishing
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        run: |
          npm run typecheck
          node scripts/check-release-config.mjs
          node scripts/sync-shared.mjs --check
          npm run lint
          npm test -- --ci
          EXPO_PUBLIC_AURIVAN_CLOUD=1 EXPO_PUBLIC_AURIVAN_CLOUD_BACKEND=memory npm test -- --ci
          EXPO_OFFLINE=1 npx expo export --platform android --output-dir "$RUNNER_TEMP/off-android"
          bash scripts/check_off_bundle.sh "$RUNNER_TEMP/off-android"
          node scripts/check-size-budget.mjs "$RUNNER_TEMP/off-android"

      # Accounts are built OFF (docs/mobile/ARCHITECTURE.md "Cloud (built OFF)").
      # An update reaches every preview APK, so a cloud variable in the EAS
      # environment would switch accounts on remotely. Refuse to publish if
      # any EXPO_PUBLIC_AURIVAN_* variable is set there (project or account
      # wide) or in this job. A variable that IS listed always blocks the
      # update. If a list can't be read (token scope, CLI hiccup), it warns and
      # carries on: phones must keep getting updates, and with no cloud adapter
      # in the app yet (Phase 9) a stray flag can't reach a server, and the
      # memory backend never runs on a phone (src/cloud/runtime.on.ts).
      - name: Refuse to publish with a cloud variable set
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # npx installs eas-cli's dependencies fresh: run none of their install
          # scripts (dtrace-provider, protobufjs: neither is needed).
          npm_config_ignore_scripts: 'true'
        run: |
          set -uo pipefail
          for scope in project account; do
            if ! raw="$(npx --yes eas-cli@24.14.0 env:list --environment preview --format short --scope "$scope" 2>&1)"; then
              echo "::warning::Couldn't read the EAS '$scope' variables, so this check was skipped for them: $raw"
              continue
            fi
            vars="$(printf '%s\n' "$raw" | sed 's/\x1b\[[0-9;]*m//g')"
            if printf '%s\n' "$vars" | grep -E '(^|[^A-Z0-9_])EXPO_PUBLIC_AURIVAN_[A-Z0-9_]*='; then
              echo "The EAS 'preview' environment ($scope) sets the variable above. Remove it: accounts are built OFF and only turn on in a new build." >&2
              exit 1
            fi
          done
          if env | grep -E '^EXPO_PUBLIC_AURIVAN_[A-Z0-9_]*='; then
            echo "This job sets the variable above. Remove it." >&2
            exit 1
          fi
          echo "No cloud variable is set for the preview update."

      - name: Publish the update
        if: steps.token.outputs.ok == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          npm_config_ignore_scripts: 'true'
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message="$(printf '%s' "${COMMIT_MESSAGE:-Manual update}" | head -n 1)"
          npx --yes eas-cli@24.14.0 update \
            --channel preview \
            --environment preview \
            --platform "$PLATFORM" \
            --message="$message" \
            --non-interactive
