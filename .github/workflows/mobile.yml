name: Mobile

# Typecheck + lint + unit tests for the Expo app. Also runs when question data
# changes, because the content-pack integrity test reads data/domain*.json,
# and when the shared mindset principles change (data/mindset/: the build
# checks every principle's practice ids against the bank).
# Plus the cloud guards (Uplift Phase 6, accounts built OFF; docs/mobile/
# ARCHITECTURE.md "Cloud (built OFF)"): the suite again with the cloud flag ON
# (signed out), and G2 an OFF bundle with no cloud runtime code. (G1, no
# secrets, runs on every pull request in verify.yml.)
# Plus two release guards (architecture decision, 15 Oct 2026): store builds
# listen on the "production" update channel, never "preview"; and size budgets
# for the Android JavaScript bundle (14 MB) and each certification's content
# (6 MB).

on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'data/domain*.json', 'data/mindset/**', 'supabase/functions/_shared/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'data/domain*.json', 'data/mindset/**', 'supabase/functions/_shared/**', '.github/workflows/mobile.yml']

# Read-only token: `npm ci` runs third-party install scripts, which must not
# be able to push to the repo.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install (also builds the content pack)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Release channels (a store build never listens on preview)
        run: node scripts/check-release-config.mjs
      - name: Cloud guard G8 (the server's copies of the board's text rules match the engine)
        run: node scripts/sync-shared.mjs --check
      - name: Lint (includes the design-system guard)
        run: npm run lint
      - name: Unit + content tests
        run: npm test -- --ci
      - name: Unit tests with the cloud flag ON (memory backend, signed out)
        run: npm test -- --ci
        env:
          EXPO_PUBLIC_AURIVAN_CLOUD: '1'
          EXPO_PUBLIC_AURIVAN_CLOUD_BACKEND: memory
      - name: Cloud guard G2 (the OFF Android bundle has no cloud code)
        # The flag is unset here, as in every EAS environment today.
        run: |
          EXPO_OFFLINE=1 npx expo export --platform android --output-dir "$RUNNER_TEMP/off-android"
          bash scripts/check_off_bundle.sh "$RUNNER_TEMP/off-android"
      - name: Size budgets (bundle under 14 MB, content per certification under 6 MB)
        run: node scripts/check-size-budget.mjs "$RUNNER_TEMP/off-android"
