name: Mobile

# Typecheck + lint + unit tests for the Expo app. Also runs when question data
# changes, because the content-pack integrity test reads data/domain*.json,
# and when the shared mindset principles change (data/mindset/: the build
# checks every principle's practice ids against the bank), and when the exam
# guide or final review week change (data/exam/: the build checks every note,
# principle and action they link), and when the study notes or the lessons
# change (data/cisa_notes.json, data/lessons/: content packs, Phase A, the
# build checks every link and the lessons are bundled from data/lessons/).
# Plus the cloud guards (Uplift Phase 6, accounts built OFF; docs/mobile/
# ARCHITECTURE.md "Cloud (built OFF)"): the suite again with the cloud flag ON
# (signed out), and G2 an OFF bundle with no cloud runtime code. (G1, no
# secrets, runs on every pull request in verify.yml.)
# Plus two release guards (architecture decision, 15 Oct 2026): store builds
# listen on the "production" update channel, never "preview"; and size budgets
# for the Android JavaScript bundle (20 MB) and each certification's content
# (6 MB). And the public-sample guard (28 Nov 2026, docs/mobile/
# SAMPLE_QUESTION_PACK.md): a public-sample Android export, audited exactly
# as the owner's .aab is, must PASS; then the full tree is rebuilt. CRISC and
# AAIA are bundled from data/crisc/ and data/aaia/, so changes there run this too.
# And the CIA question files (data/cia/): not bundled yet, but the suite reads every
# CIA stem to check the app finds its priority word (qualifier-case.test.ts), so a
# CIA content change must run this too (a stem broke that test unseen, 28 Nov 2026).

on:
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'data/domain*.json', 'data/free/**', 'data/cisa_notes.json', 'data/mindset/**', 'data/exam/**', 'data/lessons/**', 'data/crisc/**', 'data/aaia/**', 'data/cia/**', 'assets/kaisip-plant.js', 'assets/kaisip-cloud.js', 'supabase/functions/_shared/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'data/domain*.json', 'data/free/**', 'data/cisa_notes.json', 'data/mindset/**', 'data/exam/**', 'data/lessons/**', 'data/crisc/**', 'data/aaia/**', 'data/cia/**', 'assets/kaisip-plant.js', 'assets/kaisip-cloud.js', 'supabase/functions/_shared/**', '.github/workflows/mobile.yml']

# Read-only token: `npm ci` runs third-party install scripts, which must not
# be able to push to the repo.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    # Both full test modes plus Android export can exceed 25 minutes on hosted runners.
    # Keep all guards mandatory; allow the complete verification chain to finish.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install (also builds the content pack)
        run: npm ci
      - name: Opt-in sample question pack regression tests (restores full pack)
        run: node --test scripts/check-sample-content.mjs
      - name: Public-sample export audit (only the free samples are bundled; restores full pack)
        # The public Google Play build's settings (eas.json public-sample). The audit must say PASS.
        run: |
          KAISIP_RELEASE=public KAISIP_QUESTION_PACK=sample node scripts/build-content.mjs
          node scripts/sample-content.mjs
          KAISIP_RELEASE=public KAISIP_QUESTION_PACK=sample KAISIP_STORE_BUILD=1 EAS_BUILD_PROFILE=public-sample EXPO_OFFLINE=1 \
            npx expo export --platform android --output-dir "$RUNNER_TEMP/public-android"
          node scripts/audit-public-aab.mjs "$RUNNER_TEMP/public-android" | tee "$RUNNER_TEMP/public-audit.txt"
          grep -q '^PASS: only the free sample is bundled.$' "$RUNNER_TEMP/public-audit.txt"
          rm -rf "$RUNNER_TEMP/public-android"
          node scripts/build-content.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Release channels (a store build never listens on preview)
        run: node scripts/check-release-config.mjs
      - name: Cloud guard G8 (the server's copies of the board's text rules match the engine)
        run: node scripts/sync-shared.mjs --check
      - name: Website bundle guard (assets/kaisip-plant.js and kaisip-cloud.js match their sources)
        run: node scripts/build-web-plant.mjs --check
      - name: Lint (includes the design-system guard)
        run: npm run lint
      - name: Unit + content tests
        run: npm test -- --ci
      - name: Unit tests with the cloud flag ON (memory backend, signed out)
        run: npm test -- --ci
        env:
          EXPO_PUBLIC_AURIVAN_CLOUD: '1'
          EXPO_PUBLIC_AURIVAN_CLOUD_BACKEND: memory
      - name: Cloud guard G2 (the OFF Android bundle has no cloud code)
        # The flag is unset here, as in every EAS environment today.
        run: |
          EXPO_OFFLINE=1 npx expo export --platform android --output-dir "$RUNNER_TEMP/off-android"
          bash scripts/check_off_bundle.sh "$RUNNER_TEMP/off-android"
      - name: Size budgets (bundle under 20 MB, content per certification under 6 MB)
        run: node scripts/check-size-budget.mjs "$RUNNER_TEMP/off-android"
