name: Keep the database awake

# Supabase pauses a Free-plan project after 7 days without activity, and a
# paused project stops sign-in and sync for every learner. Every 2 days this
# job makes one real database read through the public REST API, the same
# read the apps make before sign-in (the board's settings row; anon may read
# it by design). If the project is paused or down, the read fails, the run
# turns red and GitHub emails the owner, so this doubles as an uptime check.
# (docs/mobile/ACCOUNTS_BETA_PLAN.md §6, docs/mobile/SCALING.md.)
#
# It uses ONLY public values, from repository VARIABLES (Settings → Secrets
# and variables → Actions → Variables), never a secret:
#   SUPABASE_URL              https://<project ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable key (it starts sb_publishable_)
# Until both are set the job says so and stops green. A value that isn't the
# publishable key (a secret key, or a legacy JWT key) is refused without
# being used or printed: secret keys never go in a variable, whose value
# anyone with read access to the settings can see.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# with no commits; turn it back on with: gh workflow enable keep-awake.yml

on:
  schedule:
    - cron: '17 3 */2 * *' # 03:17 UTC every 2 days (11:17 in Manila)
  workflow_dispatch:

# No checkout and no token rights needed: one curl call.
permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Read one row with the publishable key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the board settings row
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::notice::Keep-awake skipped: set the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY to turn it on."
            exit 0
          fi
          if ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https://[a-z0-9]{20}\.supabase\.co/?$'; then
            echo "::error::SUPABASE_URL must look like https://<20-character project ref>.supabase.co"
            exit 1
          fi
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *)
              echo "::error::SUPABASE_PUBLISHABLE_KEY must be the publishable key (it starts sb_publishable_). It was not used. If a secret key was pasted there, rotate it in Supabase now."
              exit 1
              ;;
          esac
          url="${SUPABASE_URL%/}/rest/v1/board_settings?select=read_scope&limit=1"
          body=$(curl -sS --fail-with-body --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Accept: application/json' "$url") || {
            echo "::error::The database did not answer. The project may be paused: open the Supabase dashboard and restore it."
            exit 1
          }
          if ! printf '%s' "$body" | grep -q '"read_scope"'; then
            echo "::error::The database answered, but not with the expected row."
            exit 1
          fi
          echo "Database awake: one row read at $(date -u +%Y-%m-%dT%H:%MZ)."
