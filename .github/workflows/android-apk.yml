name: Android test APK

# Builds an installable test APK (for the owner's and testers' own phones, not
# the Play Store) and attaches it to a GitHub Release. On a phone, open the
# repo's Releases page while signed in to GitHub and tap the .apk to download.
#
# When it runs: by hand only (Actions tab → "Android test APK" → "Run
# workflow"). It is the BACKUP route: the main test APK comes from EAS Build
# (expo.dev, profile "preview"), which pairs with EAS Update for over-the-air
# updates. APKs from the two routes are signed with different keys and cannot
# be installed over each other, so this one never runs on its own. A manual
# run rebuilds and replaces the APK for the current version.
#
# The APK is signed with the standard Android debug key (fine for personal
# installs, and the same key every time, so a new APK installs over the old one
# and keeps the learner's progress). Since 1.23 the package id is com.kaisip.app
# (the app was renamed from Aurivan, com.aurivan.app): the first KaiSip APK
# installs as a NEW app next to the old one, and progress moves by a backup file.
# The Play Store upload key comes at store time.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the app version
        id: v
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version already has an APK
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "push" ] && gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} already has an APK; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.skip.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install (also builds the content pack)
        if: steps.skip.outputs.skip != 'true'
        run: npm ci

      # The update "runtime" label must be computed BEFORE the Android project
      # exists, exactly as the phone-update workflow computes it when it
      # publishes. Computed inside the Gradle build instead, it came out
      # different (the 1.16.0 and 1.17.0 APKs embedded 783f793…, while every
      # update was published for 5e26d4b…), so those APKs never received an
      # update. The value is forced into the build below and checked after.
      - name: Compute the update runtime (managed, before prebuild)
        if: steps.skip.outputs.skip != 'true'
        id: rt
        run: |
          runtime="$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).hash))')"
          [ -n "$runtime" ] || { echo "Could not compute the update runtime."; exit 1; }
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Update runtime: $runtime"

      # This APK is a test build, so it listens to the "preview" update channel.
      # The committed app.json sets no channel on purpose (store builds get
      # "production" from eas.json on EAS; scripts/check-release-config.mjs),
      # so set it here, in this throwaway checkout, AFTER the runtime above was
      # computed from the committed files (the runtime is forced into the
      # build below, so it still matches the published updates).
      - name: Listen to the preview update channel
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/set-update-channel.mjs preview

      - name: Generate the Android project
        if: steps.skip.outputs.skip != 'true'
        run: |
          npx expo prebuild --platform android --no-install
          grep -q 'expo-channel-name&quot;:&quot;preview&quot;' android/app/src/main/AndroidManifest.xml \
            || { echo "The Android project does not listen to the preview channel; this APK would never update."; exit 1; }
          echo "The APK will listen to the preview update channel."

      # Phones only (arm64 and older 32-bit arm); emulator CPUs are left out to
      # keep the build and the download smaller.
      # Since mobile 1.24 release builds are shrunk with R8 (expo-build-properties
      # in app.json), so this APK is also the release-build smoke test: install
      # it and try every screen, notifications, backup/restore and an update
      # before a store build. If R8 removed something a library needs, add a keep
      # rule in app.json (expo-build-properties "extraProguardRules").
      # The default Gradle memory (2 GB, 512 MB metaspace) runs out during the
      # release lint pass; the runner has 16 GB, so give Gradle room. Then
      # check the APK really exists, so a failed build can never look green.
      - name: Build the release APK
        if: steps.skip.outputs.skip != 'true'
        working-directory: mobile/android
        env:
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.rt.outputs.runtime }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g/' gradle.properties
          grep -q '^org.gradle.jvmargs=' gradle.properties || echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g' >> gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "No APK was produced; see the Gradle errors above."; exit 1; }
          # The APK must carry the same runtime the updates are published for.
          embedded="$(unzip -p "$apk" assets/fingerprint)"
          if [ "$embedded" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "The APK embeds runtime $embedded but updates are published for $EXPO_UPDATES_FINGERPRINT_OVERRIDE; this APK would never update."
            exit 1
          fi
          echo "APK runtime $embedded matches the published updates."
          echo "APK size: $(du -h "$apk" | cut -f1) (R8 on; 1.18 without R8 was about 70 MB)."

      - name: Publish it to a GitHub Release
        if: steps.skip.outputs.skip != 'true'
        run: |
          version="${{ steps.v.outputs.version }}"
          tag="${{ steps.v.outputs.tag }}"
          apk="KaiSip-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes="Test build of KaiSip $version for your own Android phone (not the Play Store).

          To install: open this page on the phone while signed in to GitHub, tap $apk under Assets, then open the download and allow \"Install unknown apps\" when asked. Installing a newer KaiSip APK over an older one keeps your progress. KaiSip 1.23 is a new app (new package id com.kaisip.app) and installs next to the old Aurivan app: in the old app use Settings, Your data, Save a backup, then restore that file in KaiSip.

          Built from ${GITHUB_SHA::7}. Update runtime ${{ steps.rt.outputs.runtime }} (this APK receives the over-the-air updates published for that runtime)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "KaiSip $version (test APK)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          echo "Published $apk to release $tag."
