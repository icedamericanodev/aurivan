name: Verify

# This workflow is the second-actor SoD control for the project. It runs the
# same scripts/verify_repo.sh that the local SessionStart hook runs, but in
# an environment that no contributor (human or AI) controls — so it can't be
# silently bypassed. main is protected to require this check before merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Repo health (verify_repo.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node (for ESLint via npx)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Cache npx ESLint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npx-eslint-v8

      - name: Run verify_repo.sh
        run: bash scripts/verify_repo.sh

      # Guard G1 on every pull request, whatever it touches (the repo is
      # public): no secret shapes in any tracked file, no tracked key or .env
      # file. Patterns and the narrow allowlist live next to the script.
      - name: No secrets in the repo (cloud guard G1)
        run: bash scripts/check_secrets.sh

      # The website build Cloudflare Pages runs (docs/WEBSITE_DEPLOY.md): it
      # publishes only an allowlist of files and stops on anything unexpected,
      # so a missing page or a stray file fails here, before it can deploy.
      - name: Website build (allowlist only)
        run: bash scripts/build_site.sh
