# KaiSip: LOCAL Supabase only (`supabase start`, CI's supabase.yml job).
# This file holds no project ref, URL or key, and nothing here is ever
# pushed to the hosted project automatically: migrations are applied through
# the Supabase MCP after review (docs/mobile/ACCOUNTS_BETA_PLAN.md §3.3), and
# the [auth] values below are mirrored BY HAND on the hosted dashboard (the
# owner's checklist, ACCOUNTS_BETA_PLAN.md §9 F). Where the hosted value
# differs from the local one, the comment says so. Secrets only ever come
# from env(...) or Function secrets.

project_id = "aurivan"

[api]
enabled = true
port = 54321
# REST only. GraphQL is not exposed: the app never uses it, so it is one
# less surface to audit.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# No seed data: pgTAP tests create and roll back their own rows.
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email catcher (Mailpit): sign-in codes land here, never in a real inbox.
[local_smtp]
enabled = true
port = 54324

[storage]
# No buckets yet. delete-account already clears user/<uid>/ when one is added.
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# Google sign-in goes through the browser with PKCE on the web and Android
# (accounts beta), so it needs exact redirect URLs. Hosted: Site URL
# https://kaisip.com, Redirect URLs exactly "https://kaisip.com/" and
# "kaisip://auth-callback". No wildcards, no pages.dev or workers.dev.
# Email sign-in uses 8-digit codes and needs no redirect.
additional_redirect_urls = ["kaisip://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# The app never offers passwords. These only harden the API path that exists anyway.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
# Per hour. Local Mailpit only. Hosted (custom SMTP through Resend's free
# plan, 100 emails a day): email_sent 20, token_verifications 30,
# sign_in_sign_ups 30, token_refresh 150.
email_sent = 2
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 0

# Captcha: Cloudflare Turnstile (Managed, hostname kaisip.com). Hosted:
# switched on LAST, after both clients send tokens and the smoke test has
# run (ACCOUNTS_BETA_PLAN.md §4). It guards sending codes (/otp).
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
# Secure email change: confirm on both the old and the new address.
double_confirm_changes = true
# Never allow unverified email sign-ins.
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
# 8-digit code, valid for 10 minutes (security audit L7, 27 Oct 2026: the
# Auth server has no per-code try counter, so 8 digits make guessing a
# code 100 times harder than 6; the owner's first choice was 6).
otp_length = 8
otp_expiry = 600

# Code-only emails: the templates carry {{ .Token }} and no link. The
# hosted copies are pasted from docs/mobile/AUTH_EMAIL_TEMPLATES.md, which
# matches these files. Password reset is not offered, but its template is
# code-only too, so no KaiSip email ever carries a sign-in link.
[auth.email.template.confirmation]
subject = "Your KaiSip sign-in code"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.magic_link]
subject = "Your KaiSip sign-in code"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.email_change]
subject = "Confirm your new email for KaiSip"
content_path = "./supabase/templates/email_change_code.html"

[auth.email.template.recovery]
subject = "Your KaiSip sign-in code"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.reauthentication]
subject = "Your KaiSip confirmation code"
content_path = "./supabase/templates/otp_code.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

# TOTP (an authenticator app) is ON for STAFF (security audit M2, 21 Oct
# 2026): the staff-action Edge Function refuses the queue and every action
# unless the session passed a second factor (JWT `aal` = 'aal2'). Learners
# are never asked to enrol (the Phase 9 app offers enrolment on the staff
# screen only; see docs/mobile/SECURITY_GATES.md). Mirror
# this by hand on the hosted project (Dashboard > Authentication > Multi-Factor).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Accounts beta: Google through the browser with PKCE (one Google Cloud
# "Web application" client; no Android client, no ID-token flow); Apple
# later, before any iPhone release with accounts.
# Off locally because they need owner accounts (Apple Services ID, Google
# client IDs) that only exist at Phase 9; the client IDs and secrets then come
# from env, never from this file. Turn on locally with real test credentials:
#   SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID / _SECRET, ..._GOOGLE_CLIENT_ID / _SECRET
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Native-app endpoints. The gateway checks the JWT first; each function then
# re-verifies it with the Auth server and checks a recent sign-in.
[functions.delete-account]
verify_jwt = true

[functions.export-my-data]
verify_jwt = true

# The feedback board (Phase 8). board-submit ships the leak guard's
# fingerprint, built at deploy time by scripts/build-leakprint.mjs
# (gitignored): without it every post is refused.
[functions.board-submit]
verify_jwt = true
static_files = ["./functions/board-submit/leakprint.json"]

[functions.staff-action]
verify_jwt = true

# Called by pg_cron with its own secret (STAFF_DIGEST_SECRET), never by the
# app, so the gateway's user-JWT check is off and the function checks the secret.
[functions.staff-digest]
verify_jwt = false

[analytics]
enabled = false
