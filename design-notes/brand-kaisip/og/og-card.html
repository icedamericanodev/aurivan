<!doctype html>
<!-- KaiSip link-preview card (og:image), 1200x630. Render with Playwright or any
     headless Chromium at a 1200x630 viewport, device scale 1, and save as
     assets/og-kaisip.png (keep it under ~300 KB). The lockup, headline and
     subline stay inside the centred 630x630 safe area (a square crop still
     reads), and the subline is upright at 40px+ so it survives a 300px
     thumbnail. No question count, no ISACA marks: CISA only as plain text. --><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Fraunces'; font-weight: 400; src: url('../../../assets/fonts/Fraunces_400Regular.woff2'); }
@font-face { font-family: 'Fraunces'; font-weight: 500; src: url('../../../assets/fonts/Fraunces_500Medium.woff2'); }
@font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 400; src: url('../../../assets/fonts/Fraunces_400Regular_Italic.woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 400; src: url('../../../assets/fonts/Figtree_400Regular.woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 500; src: url('../../../assets/fonts/Figtree_500Medium.woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 600; src: url('../../../assets/fonts/Figtree_600SemiBold.woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
/* The forest panel, lit from the top edge, full bleed. */
body { position: relative; font-family: Figtree, sans-serif; color: #F3F1EA;
  background: linear-gradient(180deg, #245A40 0%, #1E4A34 62%); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
/* Decorative art lives in the side strips, outside the centred 630x630 safe area. */
.frond { position: absolute; right: -6px; top: 22px; width: 330px; height: 330px; fill: none; stroke: #3A6B51; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.rings { position: absolute; left: -170px; bottom: -150px; width: 470px; height: 470px; fill: none; stroke: #2F5C44; stroke-width: 1.5; }
/* Everything that must read in a square crop: x 285–915. */
.safe { position: absolute; left: 285px; top: 0; width: 630px; height: 630px; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 50px; }
.lockup { width: 190px; height: auto; display: block; }
h1 { font: 500 78px/80px Fraunces, serif; letter-spacing: -1.6px; margin-top: 30px; }
.sub { font: 400 42px/48px Fraunces, serif; color: #C9DACD; margin-top: 18px; letter-spacing: -0.4px; }
/* A cropped look at the answer screen, rising from the bottom edge. */
.tile { position: absolute; left: 330px; top: 470px; width: 540px; height: 260px; background: #FFFFFF; border-radius: 26px 26px 0 0;
  box-shadow: 0 -10px 40px -12px rgba(0,0,0,.35); padding: 24px 26px; color: #17231B; }
.row { display: flex; gap: 14px; align-items: center; background: #E0EDE2; border-radius: 16px; padding: 14px 16px; }
.badge { width: 34px; height: 34px; border-radius: 50%; background: #1D6A43; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.tag { font: 600 20px/24px Figtree; color: #1D6A43; text-align: left; }
.leaves { display: flex; gap: 22px; margin-top: 16px; padding-left: 4px; }
.leaf { display: flex; align-items: center; gap: 8px; font: 600 19px/24px Figtree; }
.leaf svg { width: 22px; height: 22px; }
.elim { color: #7A5100; } .final { color: #465349; } .cue { color: #24603F; }
</style></head><body>
<svg class="rings" viewBox="0 0 470 470"><circle cx="235" cy="235" r="225"/><circle cx="235" cy="235" r="180"/><circle cx="235" cy="235" r="135"/><circle cx="235" cy="235" r="90"/></svg>
<svg class="frond" id="frond" viewBox="0 0 160 160"></svg>
<div class="safe">
  <img class="lockup" src="../lockup_dark.svg" alt="">
  <h1>Think like an<br>IS auditor.</h1>
  <p class="sub">CISA exam prep, taught<br>the way the exam thinks.</p>
</div>
<div class="tile">
  <div class="row">
    <span class="badge"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <span class="tag">Best answer · D</span>
  </div>
  <div class="leaves">
    <span class="leaf elim"><svg viewBox="0 0 22 22"><path d="M11 3.5C15.5 7.2 15.5 14.8 11 18.5C6.5 14.8 6.5 7.2 11 3.5Z" fill="#7A5100" fill-opacity=".18" stroke="#7A5100" stroke-width="1.5"/></svg>Eliminate two</span>
    <span class="leaf final"><svg viewBox="0 0 22 22"><path d="M11 3.5C15.5 7.2 15.5 14.8 11 18.5C6.5 14.8 6.5 7.2 11 3.5Z" fill="#465349" fill-opacity=".18" stroke="#465349" stroke-width="1.5"/></svg>Final two</span>
    <span class="leaf cue"><svg viewBox="0 0 22 22"><path d="M11 3.5C15.5 7.2 15.5 14.8 11 18.5C6.5 14.8 6.5 7.2 11 3.5Z" fill="#2B6E4A" fill-opacity=".18" stroke="#2B6E4A" stroke-width="1.5"/></svg>Exam cue</span>
  </div>
</div>
<script>
(function(){
  var p0=[96,150],pc=[70,80],p1=[118,6],path='M'+p0+' Q'+pc+' '+p1;
  function pt(u){var a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;return [a*p0[0]+b*pc[0]+c*p1[0],a*p0[1]+b*pc[1]+c*p1[1]];}
  for(var i=1;i<=9;i++){var u=i/10.5,q=pt(u),q2=pt(u+0.02);var ang=Math.atan2(q2[1]-q[1],q2[0]-q[0]);var len=30*(1-u*0.55),wid=len*0.28;
    [-1,1].forEach(function(side){var a2=ang+side*0.95;var tip=[q[0]+Math.cos(a2)*len,q[1]+Math.sin(a2)*len];var n=[-Math.sin(a2)*wid,Math.cos(a2)*wid],mid=[(q[0]+tip[0])/2,(q[1]+tip[1])/2];
      path+=' M'+q[0].toFixed(1)+' '+q[1].toFixed(1)+' Q'+(mid[0]+n[0]).toFixed(1)+' '+(mid[1]+n[1]).toFixed(1)+' '+tip[0].toFixed(1)+' '+tip[1].toFixed(1)+' Q'+(mid[0]-n[0]).toFixed(1)+' '+(mid[1]-n[1]).toFixed(1)+' '+q[0].toFixed(1)+' '+q[1].toFixed(1);});}
  document.getElementById('frond').innerHTML='<path d="'+path+'"/>';
})();
</script>
</body></html>
