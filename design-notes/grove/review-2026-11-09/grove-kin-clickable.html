const KEY='kaisip-kin-prototype-v2';
const initialState=()=>({active:'pip',owned:{pip:{xp:0,name:''},mossback:{xp:0,name:''},luma:{xp:0,name:''}},target:'russet',motion:true,events:[],serial:0,practice:null});
function sanitize(raw){
 const base=initialState();if(!raw||typeof raw!=='object')return base;
 const owned={};for(const kin of kinCatalog){const v=raw.owned?.[kin.id];if(v&&typeof v==='object')owned[kin.id]={xp:Math.max(0,Math.min(6,Number.isFinite(v.xp)?Math.floor(v.xp):0)),name:typeof v.name==='string'?v.name.slice(0,24):''};}
 if(!owned.pip)owned.pip={xp:0,name:''};
 return {...base,owned,active:owned[raw.active]?raw.active:'pip',target:kinCatalog.some(k=>k.id===raw.target)&&!owned[raw.target]?raw.target:kinCatalog.find(k=>!owned[k.id])?.id||null,motion:raw.motion!==false,events:Array.isArray(raw.events)?raw.events.filter(e=>typeof e==='string').slice(-200):[],serial:Number.isSafeInteger(raw.serial)&&raw.serial>=0?raw.serial:0};
}
let state=initialState();try{state=sanitize(JSON.parse(localStorage.getItem(KEY)))}catch{}
let storageFailed=false,filter='All',notice='',moment=null;
const main=document.getElementById('screen'),dialog=document.getElementById('dialog');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageFailed=false}catch{storageFailed=true}}
const escapeText=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kinById=id=>kinCatalog.find(k=>k.id===id);
const stageOf=id=>Math.min(2,Math.floor((state.owned[id]?.xp||0)/3));
const displayName=id=>state.owned[id]?.name||kinById(id).name;
const artHero=(id,stage=stageOf(id),live=true)=>`<div class="hero-art">${kinArt(id,stage,live)}</div>`;
const back=(label,route)=>`<a class="back" href="#${route}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>${label}</a>`;
const link=(label,route,cls='btn')=>`<a class="${cls}" href="#${route}">${label}</a>`;
const row=(label,end,route)=>`<a class="row" href="#${route}"><span>${label}</span><span class="end">${end} <span aria-hidden="true">›</span></span></a>`;
function applyEvent(event){
 if(state.events.includes(event.id))return null;
 state.events.push(event.id);state.events=state.events.slice(-200);
 if(event.type==='discover'){
  const id=state.target;if(!id||state.owned[id])return null;
  state.owned[id]={xp:0,name:''};state.target=kinCatalog.find(k=>!state.owned[k.id])?.id||null;
  return {type:'discovery',id};
 }
 const id=state.active,before=stageOf(id);state.owned[id].xp=Math.min(6,state.owned[id].xp+(event.type==='topic'?3:1));
 const after=stageOf(id);return after>before?{type:'evolution',id,before,after}:null;
}
function advance(type){
 const result=applyEvent({id:`demo-${++state.serial}`,type});save();closeDialog();
 if(result){moment=result;go(result.type)}else{notice=type==='discover'?'You have met every kin in this demo.':'Study activity recorded. Your companion’s progress is saved.';go('companion')}
}
function go(route){if(location.hash==='#'+route)render();else location.hash=route;}
function companion(){
 const id=state.active,k=kinById(id),stage=stageOf(id),xp=state.owned[id].xp;
 return back('You','you')+artHero(id)+`<div class="nameblock"><h1>${escapeText(displayName(id))}</h1><p class="muted">${k.forms[stage]} form</p></div>`+(stage<2?`<section class="next"><h2>Next evolution</h2><p>${stage===0?'Complete 3 lessons':'Complete 3 more lessons'}</p><div class="track" aria-hidden="true"><span style="width:${xp%3/3*100}%"></span></div><small>${xp%3} of 3 lessons</small></section>`:`<section class="next"><h2>Fully grown</h2><p>${escapeText(displayName(id))} keeps you company as you study.</p></section>`)+row('Your collection',`${Object.keys(state.owned).length} kin`,'collection')+`<button class="row" data-action="rename"><span>Rename</span><span class="chev" aria-hidden="true">›</span></button><button class="row" data-action="motion"><span>Gentle motion</span><span class="end">${state.motion?'On':'Off'}</span></button><div class="actions">${link('Back to study','study','btn alt')}</div>`;
}
function collection(){
 const list=kinCatalog.filter(k=>filter==='All'||k.family===filter||(filter==='Collected'&&state.owned[k.id]));
 return back(escapeText(displayName(state.active)),'companion')+`<header class="title"><h1>Your collection</h1><p class="muted">${Object.keys(state.owned).length} kin found</p></header><div class="filters" aria-label="Filter collection">${['All','Collected','Animals','Insects','Plants','Fungi','Ocean'].map(f=>`<button class="filter" data-filter="${f}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div><div class="grid">${list.map(k=>{const owned=!!state.owned[k.id],selected=state.active===k.id;return `<a class="tile ${selected?'selected':''} ${owned?'':'uncollected'}" href="#kin/${k.id}" aria-label="${escapeText(displayNameSafe(k.id))}, ${selected?'your companion':owned?'collected':'not collected'}">${selected?'<span class="selected-mark" aria-hidden="true">✓</span>':''}${kinArt(k.id,stageOf(k.id))}<h2>${escapeText(displayNameSafe(k.id))}</h2><p>${selected?'With you':owned?k.forms[stageOf(k.id)]+' form':state.target===k.id?'Next discovery':k.kind}</p></a>`}).join('')}</div><p class="footer-note">Your kin stay with you.</p>`;
}
function displayNameSafe(id){return state.owned[id]?displayName(id):kinById(id).name}
function detail(id){
 const k=kinById(id);if(!k)return companion();const owned=!!state.owned[id],active=id===state.active,stage=stageOf(id);
 return back('Collection','collection')+artHero(id,stage)+`<div class="nameblock"><p class="eyebrow">${k.kind}</p><h1>${escapeText(displayNameSafe(id))}</h1><p class="muted">${owned?k.forms[stage]+' form':k.line}</p></div>`+(owned?`<div class="actions"><button class="btn ${active?'alt':''}" data-companion="${id}" ${active?'disabled':''}>${active?'Your companion':'Choose as companion'}</button>${link('View companion','companion','btn alt')}</div><details><summary>Growth</summary><p>${k.forms.join(' → ')}. Progress stays with each kin when you switch companions.</p></details>`:`<section class="next"><h2>${state.target===id?'Your next discovery':'Meet '+k.name}</h2><p>Complete a review to discover this kin.</p></section><button class="btn" data-target="${id}" ${state.target===id?'disabled':''}>${state.target===id?'Chosen as next discovery':'Choose next discovery'}</button><div class="actions">${link('Back to collection','collection','btn alt')}</div>`);
}
function evolution(){
 if(!moment||moment.type!=='evolution')return companion();const {id,before,after}=moment,k=kinById(id);
 return back('You','you')+`<p class="footer-note">Study milestone reached</p><div class="evolution-art"><div class="new-form">${artHero(id,after,false)}</div><div class="old-form">${artHero(id,before,false)}</div></div><div class="nameblock"><h1>${escapeText(displayName(id))} grew!</h1><p class="muted">${k.forms[after]} form</p></div><div class="stages"><div>${kinArt(id,before)}<p>${k.forms[before]}</p></div><span class="stage-arrow" aria-hidden="true">→</span><div>${kinArt(id,after)}<p>${k.forms[after]}</p></div></div><p class="muted">Your study helped ${escapeText(displayName(id))} grow.</p><div class="actions">${link('Continue','companion')}${link('View collection','collection','linkbutton')}<button class="linkbutton" data-action="replay">Replay reveal</button></div>`;
}
function discovery(){
 if(!moment||moment.type!=='discovery')return collection();const id=moment.id,k=kinById(id);
 return back('Collection','collection')+`<p class="footer-note">Review complete</p>`+artHero(id)+`<div class="nameblock"><p class="eyebrow">New kin</p><h1>You met ${k.name}</h1><p class="muted">${k.line}</p></div><div class="actions"><button class="btn" data-companion="${id}">Choose as companion</button>${link('Keep '+escapeText(displayName(state.active)),'companion','btn alt')}${link('View collection','collection','linkbutton')}</div>`;
}
const domains=['IS Audit','IT Governance','IS Acquisition','IS Operations','Info Protection'];
function you(){return back('Your companion','companion')+`<header class="title"><p class="eyebrow">CISA</p><h1>You</h1><p class="muted">Your study progress</p></header><section class="panel"><h2>A small start</h2><div class="stats"><div><small>Answered</small><strong>1</strong></div><div><small>Study days</small><strong>1 day</strong></div></div></section><section class="panel"><h2>Your areas</h2>${domains.map((d,i)=>`<a class="score-row" href="#area/${i}"><span>${d}</span><small>${i===0?'1 answered':'Not started'} <span aria-hidden="true">›</span></small></a>`).join('')}<details><summary>About these scores</summary><p>An area gets a score after 30 answers. Scores use your latest tries.</p><p>Building · under 70<br>Steady · 70 to 79<br>Strong · 80 and up</p></details></section>${row('Your companion',escapeText(displayName(state.active)),'companion')}${row('Your collection',Object.keys(state.owned).length+' kin','collection')}<p class="footer-note">Sample early-progress data</p>`}
function area(index){const i=Number(index);if(!Number.isInteger(i)||!domains[i])return you();return back('You','you')+`<header class="title"><h1>${domains[i]}</h1><p class="muted">${i===0?'1 of 30 answers':'No answers yet'}</p></header><section class="panel"><h2>Build your picture</h2><p>Your score appears after 30 answers in this area.</p></section><div class="actions">${link('Try sample practice','study')}</div>`}
function study(){
 return back('You','you')+`<header class="title"><p class="eyebrow">Sample practice</p><h1>One small step</h1><p class="muted">Try the companion flow with one sample.</p></header><section class="panel"><h2>Before restoring a disrupted service, what should the team check?</h2>${['That recovery is safe and the cause is understood','Only that the service starts successfully','Whether the incident can be closed immediately'].map((v,i)=>`<button class="choice" data-answer="${i}" aria-pressed="${state.practice===i}" ${state.practice!==null?'disabled':''}>${v}</button>`).join('')}<div role="status">${state.practice!==null?`<p><strong>${state.practice===0?'Correct':'Check that recovery is safe and the cause is understood.'}</strong></p><p>Restoring too soon can repeat the disruption.</p>`:''}</div></section><div class="actions">${state.practice!==null?'<button class="btn" data-action="practice-finish">Finish sample</button>':''}</div>`;
}
let lastRoute='';
function render(){
 const route=location.hash.slice(1)||'companion',[page,id]=route.split('/');
 const views={companion,collection,evolution,discovery,you,study};
 main.innerHTML=(page==='kin'?detail(id):page==='area'?area(id):(views[page]||companion)())+`<div class="status" role="status">${escapeText(notice)}</div>`+(storageFailed?'<p class="muted">Saving is unavailable. Changes last for this visit.</p>':'');
 notice='';
 document.body.classList.toggle('still',!state.motion);
 if(lastRoute!==route){window.scrollTo(0,0);if(lastRoute)main.focus({preventScroll:true})}lastRoute=route;
}
let dialogOpener=null;
function closeDialog(){if(dialog.open)dialog.close();dialogOpener?.focus();}
function openDialog(body){dialogOpener=document.activeElement;dialog.innerHTML=body;const heading=dialog.querySelector('h2');heading.id='dialog-heading';dialog.setAttribute('aria-labelledby',heading.id);dialog.showModal()}
function demoTools(){openDialog(`<div class="dialoghead"><h2>Try the experience</h2><button data-action="close" aria-label="Close">×</button></div><p>These controls simulate study milestones. Demo progress is saved in this browser.</p><button class="btn" data-event="discover">Complete a review · meet a kin</button><button class="btn" data-event="topic">Finish a topic · evolve companion</button><button class="btn alt" data-event="lesson">Complete one lesson</button><div class="actions">${link('See simplified progress','you','btn alt')}</div><label class="toggle"><span>Gentle motion</span><input id="motion" type="checkbox" ${state.motion?'checked':''}></label><small>Your device’s Reduce Motion setting takes priority.</small><button class="linkbutton" data-action="reset-ask">Reset demo</button>`)}
function handleClick(e){
 const b=e.target.closest('button');if(!b){if(e.target.closest('a')&&dialog.open)closeDialog();return}
 if(b.dataset.event){b.disabled=true;advance(b.dataset.event);return}
 if(b.dataset.filter){filter=b.dataset.filter;render();main.querySelector(`[data-filter="${filter}"]`)?.focus();return}
 if(b.dataset.companion&&state.owned[b.dataset.companion]){state.active=b.dataset.companion;notice=displayName(state.active)+' is now your companion.';save();go('companion');return}
 if(b.dataset.target&&kinById(b.dataset.target)&&!state.owned[b.dataset.target]){state.target=b.dataset.target;notice=kinById(state.target).name+' is your next discovery.';save();render();return}
 if(b.dataset.answer!==undefined&&state.practice===null){state.practice=Number(b.dataset.answer);render();main.querySelector('[data-action="practice-finish"]')?.focus();return}
 switch(b.dataset.action){
 case 'demo':demoTools();break;
 case 'close':closeDialog();break;
 case 'motion':state.motion=!state.motion;save();render();main.querySelector('[data-action="motion"]')?.focus();break;
 case 'replay':render();main.querySelector('[data-action="replay"]')?.focus();break;
 case 'practice-finish':state.practice=null;advance('discover');break;
 case 'rename':openDialog(`<form id="rename"><div class="dialoghead"><h2>Rename companion</h2><button type="button" data-action="close" aria-label="Close">×</button></div><label for="kin-name">Name</label><input id="kin-name" type="text" name="kinName" maxlength="24" value="${escapeText(state.owned[state.active].name)}" placeholder="${kinById(state.active).name}"><button class="btn">Save name</button></form>`);break;
 case 'reset-ask':openDialog('<div class="dialoghead"><h2>Reset this demo?</h2><button data-action="close" aria-label="Close">×</button></div><p>Return to Pip, Mossback and Luma in their first forms. This only resets the prototype in this browser.</p><button class="btn alt" data-action="close">Keep my demo</button><button class="btn" data-action="reset">Reset demo</button>');break;
 case 'reset':state=initialState();moment=null;notice='Demo reset.';filter='All';save();closeDialog();go('companion');break;
 }
}
document.addEventListener('click',handleClick);
dialog.addEventListener('change',e=>{if(e.target.id==='motion'){state.motion=e.target.checked;save();document.body.classList.toggle('still',!state.motion);render()}});
dialog.addEventListener('submit',e=>{if(e.target.id!=='rename')return;e.preventDefault();state.owned[state.active].name=new FormData(e.target).get('kinName').trim().slice(0,24);save();closeDialog();notice='Name saved.';render();main.querySelector('[data-action="rename"]')?.focus()});
window.addEventListener('hashchange',render);
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('away',document.hidden));
render();
</script></body></html>
