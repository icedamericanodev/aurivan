#grove-badges{--gb-bg:#F3F1EA;--gb-raised:#F8F7F2;--gb-ink:#17231B;--gb-secondary:#465349;--gb-line:#DFDCD1;--gb-control:#7D897F;--gb-soft:#E9E6DC;--gb-accent:#24603F;--gb-btn:#1E4A34;--gb-onbtn:#F7F5EF;--gb-forest:#1E4A34;--gb-foresttop:#245A40;--gb-track:#E2E0D6;padding:12px 0;font:16px/1.5 Figtree,sans-serif;color:var(--gb-ink)}
#grove-badges[data-theme="dark"]{--gb-bg:#111613;--gb-raised:#1B231E;--gb-ink:#ECEFE8;--gb-secondary:#B4BFB6;--gb-line:#29322B;--gb-control:#66736A;--gb-soft:#202A23;--gb-accent:#93CFAA;--gb-btn:#A9D9BA;--gb-onbtn:#0F1F16;--gb-forest:#21432F;--gb-foresttop:#285139;--gb-track:#2A332C}
#grove-badges *{box-sizing:border-box}#grove-badges button,#grove-badges select{font:inherit;color:inherit}#grove-badges button:focus-visible,#grove-badges select:focus-visible{outline:3px solid var(--gb-accent);outline-offset:3px}
#grove-badges .gb-caption{max-width:410px;margin:0 auto 12px;padding:0 10px;font-size:13px;background:var(--gb-bg);color:var(--gb-secondary)}
#grove-badges .gb-phone{max-width:410px;margin:auto;background:var(--gb-bg);border:1px solid var(--gb-line);border-radius:24px;overflow:hidden}
#grove-badges .gb-preview{max-width:410px;margin:0 auto 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:12px;color:var(--gb-secondary);background:var(--gb-bg);padding:4px 10px;border-radius:10px}
#grove-badges .gb-preview select{padding:8px;border:1px solid var(--gb-control);border-radius:8px;background:var(--gb-raised);min-height:44px;font-size:14px}
#grove-badges nav{padding:8px 22px 0}#grove-badges .gb-back{padding:8px 0;min-height:48px;background:none;border:0;font-weight:600}
#grove-badges main{padding:12px 22px 22px}#grove-badges h1{font:500 38px/1.15 Fraunces,Georgia,serif;margin:0}#grove-badges h2{font:500 24px/1.2 Fraunces,Georgia,serif;margin:0}#grove-badges h3{font:600 16px/1.4 Figtree,sans-serif;margin:0}#grove-badges p{margin:0}
#grove-badges .gb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}#grove-badges .gb-info{background:none;border:0;min-width:48px;min-height:48px;padding:12px;display:grid;place-items:center;flex-shrink:0}#grove-badges .gb-info span{width:22px;height:22px;display:grid;place-items:center;border:1.5px solid var(--gb-control);border-radius:50%;font:500 15px/1 Georgia,serif}
#grove-badges .gb-help{padding:16px;background:var(--gb-soft);border-radius:14px;font-size:14px;margin:0 0 18px;color:var(--gb-secondary)}#grove-badges .gb-help p+p{margin-top:9px}#grove-badges .gb-help[hidden]{display:none}
#grove-badges .gb-muted{color:var(--gb-secondary);font-size:14px}#grove-badges .gb-hero{margin:20px 0 24px;border-radius:18px;background:linear-gradient(145deg,var(--gb-foresttop),var(--gb-forest));color:#F3F1EA;padding:18px;display:grid;grid-template-columns:1fr 76px;gap:14px;align-items:center}#grove-badges .gb-hero .gb-muted{color:#C9DACD}#grove-badges .gb-hero h2{margin:5px 0 8px}#grove-badges .gb-hero .gb-tile{width:76px;height:76px;border-radius:21px;flex-shrink:0}#grove-badges .gb-hero button{grid-column:1/-1;text-align:left;color:#F3F1EA;background:none;border:0;padding:9px 0 0;min-height:44px}
#grove-badges .gb-linehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px}#grove-badges .gb-shelf-label{display:block;font-size:14px;color:var(--gb-secondary)}#grove-badges #gb-set{margin-top:6px;display:block;width:100%;background:var(--gb-raised);border:1px solid var(--gb-control);border-radius:12px;padding:12px;font-size:16px;min-height:48px}
#grove-badges .gb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;margin:20px 0 10px}
#grove-badges .gb-badge{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:none;border:0;padding:0 0 6px;min-width:0;width:100%}
#grove-badges .gb-badge strong{font-size:14px;line-height:1.4;font-weight:600;overflow-wrap:normal}#grove-badges .gb-badge small{font-size:12px;color:var(--gb-secondary)}
#grove-badges .gb-tile{position:relative;display:flex;align-items:center;justify-content:center;width:88px;height:88px;max-width:100%;border-radius:24px;background:linear-gradient(145deg,#FFFDF7,#EAEFDF);border:1px solid #C8D0BB;box-shadow:inset 0 1px 0 #FFFFFF,0 3px 7px #17231B0A}
#grove-badges .gb-tile:before{content:'';position:absolute;inset:5px;border:1px solid #D9E1CF;border-radius:19px;pointer-events:none}#grove-badges .gb-tile img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 1px 0 #FFFFFF80)}
#grove-badges .gb-tile.gb-open{background:var(--gb-soft);border:1.5px dashed var(--gb-control);box-shadow:none}#grove-badges .gb-tile.gb-open:before{display:none}#grove-badges .gb-tile.gb-open img{filter:grayscale(1);opacity:.55}
#grove-badges .gb-detail-art{display:flex;justify-content:center;margin:10px 0 26px}#grove-badges .gb-detail-art .gb-tile{width:136px;height:136px;border-radius:34px}#grove-badges .gb-detail-art .gb-tile:before{border-radius:28px}
#grove-badges .gb-detail-title{font-size:32px}#grove-badges .gb-rule{margin-top:22px;padding-top:18px;border-top:1px solid var(--gb-line)}#grove-badges .gb-rule p{margin-top:8px;color:var(--gb-secondary)}
#grove-badges .gb-primary,#grove-badges .gb-outline{display:block;border:1px solid var(--gb-control);border-radius:12px;padding:12px 16px;min-height:48px;background:transparent;width:100%;font-weight:600;margin-top:20px}#grove-badges .gb-primary{background:var(--gb-btn);color:var(--gb-onbtn);border-color:var(--gb-btn)}
#grove-badges .gb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:60px;padding:16px 0;border:0;border-bottom:1px solid var(--gb-line);background:none;text-align:left}#grove-badges .gb-row small{display:block;font-size:14px;color:var(--gb-secondary);margin-top:3px}#grove-badges .gb-row-art{display:flex;gap:8px;margin:14px 0 3px}#grove-badges .gb-row-art .gb-tile{width:58px;height:58px;border-radius:17px}#grove-badges .gb-row-art .gb-tile:before{border-radius:12px}
#grove-badges .gb-area{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--gb-line)}#grove-badges .gb-status{font-size:14px;color:var(--gb-accent);padding:0 22px 18px;min-height:20px}
#grove-badges .gb-tier{margin-top:18px;display:flex;gap:6px;flex-wrap:wrap}#grove-badges .gb-tier span{padding:6px 10px;border:1px solid var(--gb-line);border-radius:8px;font-size:13px;color:var(--gb-secondary)}
@media(max-width:350px){#grove-badges main{padding-inline:16px}#grove-badges .gb-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}#grove-badges h1{font-size:34px}}

const sets={groundwork:'Groundwork',domains:'The Five Domains',evergreen:'Evergreen',judgement:'Sound Judgement',examDay:'Exam Day',rooted:'Rooted',moments:'Moments',fieldNotes:'Field notes'};
const tiers={'long-memory':['25 recalls','75 recalls','150 · Stretch'],rooted:['10 days','30 days','60 days'],'dress-rehearsal':['1 mock','2 spaced mocks','3 · Stretch'],'firm-footing':['70% · 20 answers','80% · 40 answers · Stretch']};
let page='badges',set='groundwork',selected='topic-clear',owned=['first-foothold','topic-clear'],help=false,theme='light';
const byId=id=>badges.find(b=>b.id===id);
function restore(s){if(s?.version!==2)return;if(Object.hasOwn(sets,s.set))set=s.set;if(byId(s.selected))selected=s.selected;if(s.theme==='dark'||s.theme==='light')theme=s.theme;if(Array.isArray(s.owned))owned=[...new Set(s.owned.filter(id=>byId(id)))];}
try{restore(window.openai?.widgetState?.privateContent?.review||JSON.parse(localStorage.getItem('kaisip-badge-design-v2')||'null'));}catch{}
function save(){const s={version:2,set,selected,theme,owned};try{localStorage.setItem('kaisip-badge-design-v2',JSON.stringify(s));}catch{}if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:'Existing Grove badges',selectedBadge:byId(selected).name,set:sets[set],theme},privateContent:{review:s}}).catch(()=>{});}
function tile(id,earned=owned.includes(id)){return `<span class="gb-tile ${earned?'':'gb-open'}" aria-hidden="true"><img src="${images[id]}" alt=""></span>`;}
function info(label){return `<button class="gb-info cursor-interaction" data-action="help" aria-label="${label}" aria-expanded="${help}" aria-controls="gb-help"><span aria-hidden="true">i</span></button>`;}
function panel(content){return `<section id="gb-help" class="gb-help" ${help?'':'hidden'} aria-label="Feature information">${content}</section>`;}
function head(title,label,content){return `<div class="gb-head"><h1>${title}</h1>${info(label)}</div>${panel(content)}`;}
function render(){root.dataset.theme=theme;root.querySelector('#gb-theme').value=theme;root.querySelector('#gb-back').textContent=page==='badges'?'‹ You':page==='detail'?'‹ Badges':page==='you'?'‹ Badges':'‹ You';
if(page==='detail'){const b=byId(selected),earned=owned.includes(selected);main.innerHTML=`<div class="gb-detail-art">${tile(b.id)}</div><div class="gb-head"><h1 class="gb-detail-title">${b.name}</h1>${info('About '+b.name)}</div><p class="gb-muted">${sets[b.set]} · ${earned?'Earned':'Not yet'}</p>${panel(`<p>Once earned, this badge stays with you.</p>${b.kind==='milestone'?'<p>For answer-based mastery badges, Coach me answers, game answers, and retests within four hours do not count.</p>':'<p>Field notes acknowledge drill skills separately from exam mastery.</p>'}`)}<section class="gb-rule"><h3>How to earn it</h3><p>${b.rule}</p>${tiers[b.id]?`<div class="gb-tier" aria-label="Existing tiers">${tiers[b.id].map(t=>`<span>${t}</span>`).join('')}</div>`:''}</section><button class="gb-outline cursor-interaction" data-action="award">${earned?'Preview earned acknowledgment':'Preview earning this badge'}</button>`;}
else if(page==='you'){main.innerHTML=head('You','About your progress','<p>Your scores describe your study progress. Badges record milestones you have earned.</p><p>You can hide badges in Settings. Earned badges remain saved.</p>')+`<button class="gb-row cursor-interaction" data-action="progress"><span>Your five areas<small>Not enough data for scores yet</small></span><span aria-hidden="true">›</span></button><div class="gb-row-art">${owned.slice(-3).map(id=>tile(id)).join('')}</div><button class="gb-row cursor-interaction" data-action="badges"><span>Badges<small>${owned.length} earned in this sample</small></span><span aria-hidden="true">›</span></button>`;}
else if(page==='progress'){main.innerHTML=head('Your five areas','How area scores work','<p>An area gets a score after 30 answers. Building is under 70, Steady is 70–79, and Strong is 80 or above.</p><p>These are study indicators, not a prediction of your exam result.</p>')+`<p class="gb-muted">Sample progress · not enough data yet</p><div style="margin-top:16px">${['IS Audit','IT Governance','IS Acquisition','IS Operations','Info Protection'].map((n,i)=>`<div class="gb-area"><span>${n}</span><span class="gb-muted">${i===0?'1 answered':'Not started'}</span></div>`).join('')}</div>`;}
else {const list=badges.filter(b=>b.set===set),next=byId('ten-topics');main.innerHTML=head('Badges','About your badges','<p>Earn badges through study milestones. Once earned, they stay.</p><p>Each set stands on its own. Field notes cover drill skills; Moments mark personal events.</p><p>Tap a badge for its earning requirement. You can hide badges in Settings.</p>')+`<section class="gb-hero"><div><p class="gb-muted">${owned.includes(next.id)?'Groundwork complete':'Next in Groundwork'}</p><h2>${next.name}</h2><p class="gb-muted">${owned.includes(next.id)?'10 topics clear in this preview':'1 of 10 topics clear'}</p></div>${tile(next.id,owned.includes(next.id))}<button class="cursor-interaction" data-action="detail" data-id="${next.id}">View milestone <span aria-hidden="true">›</span></button></section><label class="gb-shelf-label" for="gb-set">Collection</label><select id="gb-set">${Object.entries(sets).map(([id,n])=>`<option value="${id}" ${id===set?'selected':''}>${n}</option>`).join('')}</select><div class="gb-linehead"><h2>${sets[set]}</h2>${set==='moments'?'':`<span class="gb-muted">${list.filter(b=>owned.includes(b.id)).length} earned</span>`}</div><div class="gb-grid">${list.map(b=>`<button class="gb-badge cursor-interaction" data-action="detail" data-id="${b.id}" aria-label="${b.name}, ${owned.includes(b.id)?'earned':'not yet'}, view rule">${tile(b.id)}<strong>${b.name}</strong><small>${owned.includes(b.id)?'Earned':'Not yet'}</small></button>`).join('')}</div>`;main.querySelector('#gb-set').onchange=e=>{set=e.target.value;help=false;status.textContent='';save();render();main.querySelector('#gb-set').focus();};}}
function navigate(dest){page=dest;help=false;status.textContent='';render();root.querySelector('#gb-back').focus();}
root.querySelector('#gb-back').onclick=()=>navigate(page==='badges'?'you':page==='detail'?'badges':page==='you'?'badges':'you');
root.querySelector('#gb-theme').onchange=e=>{theme=e.target.value;save();render();};
main.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='help'){help=!help;const region=main.querySelector('#gb-help');region.hidden=!help;b.setAttribute('aria-expanded',String(help));return;}if(a==='detail'){selected=b.dataset.id;save();navigate('detail');return;}if(a==='award'){if(!owned.includes(selected))owned.push(selected);save();render();status.textContent='Preview — '+byId(selected).name+' earned. Your study progress is unchanged.';main.querySelector('[data-action="award"]').focus();return;}navigate(a);});
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent?.review;if(s){restore(s);render();}});render();
})();

</script>
